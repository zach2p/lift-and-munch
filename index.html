<style>
/* Layout: one narrow column, gym-whiteboard cards, bumper-plate yellow for primary actions, fixed bottom nav between Lifting and Nutrition */
:root{
  --bg:#EEF1F3; --surface:#FFFFFF; --raised:#F5F7F9; --ink:#14181C; --muted:#56606A; --line:#D4DADF; --track:#E1E6EA;
  --plate:#F5C518; --on-plate:#1B1700; --accent:#7A5A00; --note-bg:#FFF4C9;
  --good:#1D7A4B; --good-bg:#DCF1E5; --warn:#B0461A;
  --pro:#2F6FD6; --carb:#23946C; --fat:#C46F1C;
  --shadow:rgba(20,24,28,.10); --shadow-lg:rgba(20,24,28,.22);
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111417; --surface:#1A1E23; --raised:#21262C; --ink:#ECEFF1; --muted:#9CA5AE; --line:#2E353C; --track:#272D33;
  --plate:#F5C518; --on-plate:#1B1700; --accent:#F5C518; --note-bg:#3A3112;
  --good:#5FD39A; --good-bg:#17382A; --warn:#FF9D68;
  --pro:#74A2F2; --carb:#5ACB9E; --fat:#EDA55B;
  --shadow:rgba(0,0,0,.45); --shadow-lg:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111417; --surface:#1A1E23; --raised:#21262C; --ink:#ECEFF1; --muted:#9CA5AE; --line:#2E353C; --track:#272D33;
  --plate:#F5C518; --on-plate:#1B1700; --accent:#F5C518; --note-bg:#3A3112;
  --good:#5FD39A; --good-bg:#17382A; --warn:#FF9D68;
  --pro:#74A2F2; --carb:#5ACB9E; --fat:#EDA55B;
  --shadow:rgba(0,0,0,.45); --shadow-lg:rgba(0,0,0,.6); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:42rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(104px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.08;margin:0;text-wrap:balance}
h2{font-size:1.65rem;font-weight:700}
h3{font-size:1.3rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.9rem}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pro);outline-offset:2px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-weight:800;font-size:1.85rem;line-height:1}
#sync{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px;text-align:right}
#sync::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--muted)}
#sync[data-state="ok"]::before{background:var(--good)}
#sync[data-state="saving"]::before{background:var(--plate)}
#sync[data-state="err"]::before{background:var(--warn)}

.tabs{display:flex;gap:4px;padding:4px;background:var(--track);border-radius:12px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:.95rem;padding:9px 12px;border-radius:9px;min-height:42px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.view{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lbl,.field>span{font-size:.85rem;font-weight:600;color:var(--muted);letter-spacing:.01em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:10px;border:2px solid var(--plate);background:var(--plate);color:var(--on-plate);font-weight:700;font-size:1rem;cursor:pointer;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.wide{width:100%}
.mini{min-height:38px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--raised);font-weight:600;font-size:.9rem;cursor:pointer}
.link{background:none;border:0;padding:8px 6px;color:var(--accent);font-weight:600;cursor:pointer;min-height:40px}
.danger{color:var(--warn)}
.confirming{color:var(--warn);font-weight:700}
.chip.confirming,.mini.confirming{border-color:var(--warn);background:transparent}
.icon{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:var(--raised);cursor:pointer;flex:none;font-size:1.25rem;line-height:1;color:var(--muted)}
.icon:disabled{opacity:.35;cursor:default}
.icon svg{width:18px;height:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.95rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-align:left}
.chip small{font-weight:500;color:var(--muted);font-size:.8rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.75}

input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--raised);border:1px solid var(--line);border-radius:10px;min-height:46px;padding:0 12px;width:100%;min-width:0}
input:focus,select:focus{border-color:var(--ink);outline:none}
input:focus-visible,select:focus-visible{outline:2px solid var(--pro);outline-offset:1px}
input::placeholder{color:var(--muted);opacity:.6}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.inline{flex-direction:row;align-items:center;gap:10px}
.field.inline input{width:auto}
.dayline{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.switch{display:flex;align-items:center;gap:10px;font-size:.9rem;font-weight:600;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;width:46px;height:28px;min-height:0;border-radius:999px;background:var(--track);border:1px solid var(--line);position:relative;padding:0;flex:none;cursor:pointer}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px var(--shadow-lg);transition:transform .15s}
.switch input:checked{background:var(--plate);border-color:var(--plate)}
.switch input:checked::after{transform:translateX(18px)}
.note{font-size:.9rem;background:var(--note-bg);border-radius:8px;padding:8px 10px}
.err{color:var(--warn);font-weight:600;font-size:.9rem}

/* Start a workout */
.daypick{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:10px}
.daybtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--raised);cursor:pointer;text-align:left;min-height:88px}
.daybtn .dname{font-family:var(--display);font-weight:700;font-size:1.55rem;line-height:1.05}
.daybtn .dmeta{font-size:.85rem;color:var(--muted)}
.daybtn.next{border:2px solid var(--plate);background:var(--surface)}
.tag{margin-top:6px;font-size:.75rem;font-weight:700;background:var(--plate);color:var(--on-plate);padding:2px 9px;border-radius:999px}

/* Session */
.sess-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.dayname{font-size:2.6rem;font-weight:800;line-height:.95}
.progress{font-family:var(--display);font-weight:600;font-size:1.2rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ex-head h3{font-size:1.4rem}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:.85rem;color:var(--muted);margin-top:2px}
.ex-tools{display:flex;gap:2px;flex:none}
.last{font-size:.9rem;background:var(--raised);border-radius:8px;padding:8px 10px;color:var(--muted);font-variant-numeric:tabular-nums}
.last b{color:var(--ink);font-weight:600}
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:2rem minmax(0,1fr) minmax(0,1fr) 46px;gap:8px;align-items:start}
.set.head{font-size:.78rem;font-weight:600;color:var(--muted);align-items:end;margin-bottom:-4px}
.set.head span:first-child,.set.head span:last-child{text-align:center}
.sn{font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:46px;text-align:center;color:var(--muted)}
.set input{font-family:var(--display);font-weight:700;font-size:1.45rem;text-align:center;font-variant-numeric:tabular-nums;padding:0 6px}
.plates{display:block;font-size:.75rem;color:var(--muted);text-align:center;margin-top:3px;line-height:1.2}
.plates:empty{display:none}
.check{width:46px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--raised);display:grid;place-items:center;cursor:pointer;color:var(--line)}
.check[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}
.set.done input{background:var(--good-bg);border-color:transparent}
.set-actions{display:flex;flex-wrap:wrap;gap:8px}
.swap{border:1px dashed var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.foot-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding-inline:4px}

/* Autocomplete */
.combo{position:relative;flex:1 1 12rem;min-width:0}
.combo-list{position:absolute;z-index:30;top:calc(100% + 4px);left:0;right:0;margin:0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 28px -10px var(--shadow-lg);max-height:17rem;overflow:auto}
.combo-list li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px;border-radius:7px;cursor:pointer}
.combo-list li small{color:var(--muted);font-size:.8rem;text-align:right;flex:none}
.combo-list li mark{background:none;color:inherit;font-weight:700;text-decoration:underline;text-decoration-color:var(--plate);text-decoration-thickness:3px;text-underline-offset:2px}
.combo-list li[aria-selected="true"],.combo-list li:hover{background:var(--raised)}

/* Split editor */
.sday-head{display:flex;gap:6px;align-items:center}
.dname-in{font-family:var(--display);font-weight:700;font-size:1.6rem;background:transparent;border-color:transparent;padding:0 8px;margin-left:-8px;flex:1}
.dname-in:hover{border-color:var(--line)}
.srows{display:flex;flex-direction:column;gap:12px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 4.5rem 5.5rem 40px;gap:8px;align-items:end}
.srow+.srow{border-top:1px solid var(--line);padding-top:12px}
.mini-field{display:flex;flex-direction:column;gap:3px;min-width:0}
.mini-field span{font-size:.75rem;font-weight:600;color:var(--muted)}
.srow .icon{height:46px}
@media (max-width:30rem){.srow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px}.srow .sname{grid-column:1/-1}}

/* Alternatives and history */
.alt-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.alt-list li{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.alt-list .an{font-weight:600;display:block}
.alt-list small{color:var(--muted);font-size:.82rem}
.alt-btns{display:flex;gap:6px;flex-wrap:wrap}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
.grp>summary{padding:12px 0;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px solid var(--line)}
.grp>summary small{font-weight:500;color:var(--muted);margin-left:8px}
.grp>summary::after{content:"+";font-size:1.3rem;line-height:1;color:var(--muted)}
.grp[open]>summary::after{content:"\2212"}
.hrow>summary{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hd{display:block;font-size:.85rem;color:var(--muted)}
.hn{display:block;font-family:var(--display);font-weight:700;font-size:1.45rem;line-height:1.1}
.hstats{display:flex;flex-direction:column;align-items:flex-end;font-variant-numeric:tabular-nums;font-size:.9rem;text-align:right}
.hlist{list-style:none;padding:0;margin:4px 0 0;display:flex;flex-direction:column;gap:8px}
.hlist li{display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
.hlist li span:first-child{font-weight:600}

/* Nutrition */
.big{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.bn{font-family:var(--display);font-weight:800;font-size:3.8rem;line-height:.9;font-variant-numeric:tabular-nums}
.bl{font-family:var(--display);font-weight:600;font-size:1.35rem;color:var(--muted)}
.bar{height:10px;border-radius:999px;background:var(--track);overflow:hidden}
.bar span{display:block;height:100%;border-radius:inherit;max-width:100%}
.bar.over span{background:var(--warn)!important}
.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:4px}
.mb-top{display:flex;justify-content:space-between;font-size:.85rem;font-weight:600;gap:6px;margin-bottom:5px}
.mb-top .tn{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
@media (max-width:26rem){.macros{grid-template-columns:1fr;gap:10px}}
.meal-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.kc{font-family:var(--display);font-weight:700;font-size:1.2rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.kc small{font-family:var(--body);font-size:.8rem;font-weight:500;color:var(--muted)}
.entries,.pick{list-style:none;margin:0;padding:0}
.entries li,.pick li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.en{flex:1;min-width:0;display:flex;flex-direction:column}
.en>span{font-weight:600;overflow-wrap:anywhere}
.en small{color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums}
.pick{max-height:18rem;overflow:auto}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:26rem){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.qa,.mform{display:flex;flex-direction:column;gap:10px}
.qa{border-top:1px solid var(--line);padding-top:12px}
.seg-row{display:flex;flex-wrap:wrap;gap:10px}
.seg{display:inline-flex;background:var(--track);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;min-height:40px;padding:0 16px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:12px}
.form-grid .wide{grid-column:1/-1}
.qa>.combo{flex:none}
.serv-row{align-items:flex-end;flex-wrap:nowrap}
.serv-row .field{flex:0 0 6.5rem}
.serv-row p{padding-bottom:12px}
.srv{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:.85rem;flex:none}
.srv input{width:4.5rem;text-align:center;padding:0 4px}
.pair{display:flex;gap:8px}
.pair label{display:flex;align-items:center;gap:6px;flex:1;min-width:0;color:var(--muted);font-weight:600}
.res-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap}
.res-top .lbl{display:block}
.unit{font-family:var(--display);font-size:1.25rem;color:var(--muted);margin-left:6px;font-weight:600}
.mn{font-family:var(--display);font-weight:700;font-size:1.9rem;font-variant-numeric:tabular-nums}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mgrid>div{background:var(--raised);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column}
.mv{font-family:var(--display);font-weight:700;font-size:1.75rem;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.mv::before,.mline span::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--c)}
.idea-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.mline{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.9rem;font-variant-numeric:tabular-nums}
.mline span{display:inline-flex;align-items:center;gap:6px}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.tg{font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--raised);border:1px solid var(--line);color:var(--muted)}

/* Bottom nav and toast */
#bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#bnav .in{display:flex;max-width:42rem;margin:0 auto;gap:8px}
#bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 10px;border:0;background:none;color:var(--muted);font-family:var(--display);font-weight:700;font-size:1.1rem;letter-spacing:.02em;cursor:pointer;position:relative;min-height:62px}
#bnav button[aria-current="page"]{color:var(--ink)}
#bnav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:4px;border-radius:0 0 4px 4px;background:var(--plate)}
#bnav svg{width:24px;height:24px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.95rem;max-width:calc(100% - 32px);box-shadow:0 8px 24px -8px var(--shadow-lg);text-align:center}
/* Rest timer */
.rest-row{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
#rest{position:fixed;z-index:45;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom,0px));margin:0 auto;width:min(42rem,calc(100% - 32px));background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;box-shadow:0 12px 30px -10px var(--shadow-lg);display:flex;flex-direction:column;gap:10px}
.rt-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.rt-info{min-width:0;display:flex;flex-direction:column}
.rt-l{font-size:.8rem;font-weight:600;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-t{font-family:var(--display);font-weight:800;font-size:2.3rem;line-height:1;font-variant-numeric:tabular-nums}
.rt-btns{display:flex;gap:6px;flex:none}
.rt-btns button{min-height:42px;min-width:48px;padding:0 10px;border-radius:9px;border:1px solid var(--muted);background:transparent;color:inherit;font-weight:700;cursor:pointer}
.rt-bar{height:5px;border-radius:5px;background:rgba(128,128,128,.35);overflow:hidden}
.rt-bar span{display:block;height:100%;width:100%;background:var(--plate);border-radius:inherit;transition:width .25s linear}
#rest.done{background:var(--plate);color:var(--on-plate)}
#rest.done .rt-btns button{border-color:var(--on-plate)}
#rest.done .rt-bar span{background:var(--on-plate)}
body.resting .wrap{padding-bottom:calc(200px + env(safe-area-inset-bottom,0px))}
body.resting #toast{bottom:calc(172px + env(safe-area-inset-bottom,0px))}

/* Launch screen: deliberately one look, pure black with white type, in both themes */
#splash{position:fixed;inset:0;z-index:100;background:#000;color:#fff;display:flex;flex-direction:column;justify-content:space-between;gap:24px;padding:calc(28px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));cursor:pointer;transition:opacity .5s ease,visibility .5s}
#splash.hide{opacity:0;visibility:hidden}
.sp-brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.3rem;text-transform:uppercase;letter-spacing:.04em}
.sp-brand svg{width:40px;height:40px}
.sp-main{max-width:44rem}
.sp-q{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(3rem,13vw,6.5rem);line-height:.9;letter-spacing:-.01em;text-wrap:balance;margin:0}
.sp-who{margin-top:20px;font-weight:600;font-size:1rem;display:flex;align-items:center;gap:12px;color:#C8C8C8}
.sp-who::before{content:"";width:30px;height:3px;background:#F5C518;flex:none}
.sp-foot{display:flex;flex-direction:column;gap:12px}
.sp-bar{height:3px;background:#2A2A2A;border-radius:3px;overflow:hidden}
.sp-bar span{display:block;height:100%;width:0;background:#F5C518;animation:spBar 3.6s linear forwards}
.sp-skip{font-size:.85rem;color:#8C8C8C;margin:0}
.sp-q.in,.sp-who.in{animation:spIn .55s cubic-bezier(.2,.8,.2,1) both}
.sp-who.in{animation-delay:.12s}
@keyframes spIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes spBar{to{width:100%}}
@media (prefers-reduced-motion:reduce){.switch input::after,.rt-bar span{transition:none}.sp-q.in,.sp-who.in{animation:none}.sp-bar span{animation:none;width:100%}#splash{transition:none}}
</style>

<body>


<div class="wrap" id="app"></div>
<nav id="bnav" aria-label="Pages"><div class="in">
  <button type="button" data-act="page" data-page="lifting" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 9.5v5M5.5 6.5v11M18.5 6.5v11M21.5 9.5v5M5.5 12h13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>Lifting</button>
  <button type="button" data-act="page" data-page="nutrition" aria-current="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v7.5M4.5 3v5.5a2.5 2.5 0 0 0 5 0V3M7 11v10M17.5 21V3c-2.2 1.2-3.5 4-3.5 7.5V13h3.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Nutrition</button>
</div></nav>
<div id="toast" role="status" aria-live="polite" hidden></div>

  <div class="rt-top"><div class="rt-info"><span class="rt-l" id="rtl">Rest</span><span class="rt-t" id="rtt">1:30</span></div>
    <div class="rt-btns"><button type="button" data-act="restAdj" data-s="-15" aria-label="15 seconds less">−15s</button><button type="button" data-act="restAdj" data-s="15" aria-label="15 seconds more">+15s</button><button type="button" id="rtSkip" data-act="restSkip">Skip</button></div></div>
  <div class="rt-bar"><span id="rtb"></span></div>
</div>
<div id="splash" aria-hidden="true">

  <div class="sp-foot"><div class="sp-bar"><span></span></div><p class="sp-skip">Tap to start</p></div>
</div>

<script>
(() => {
'use strict';

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, '0');
const dstr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => dstr(new Date());
const toDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtDate = s => toDate(s).toLocaleDateString('en-US', {weekday: 'short', month: 'short', day: 'numeric'});
const shortDate = s => toDate(s).toLocaleDateString('en-US', {month: 'short', day: 'numeric'});
const dayWord = s => s === today() ? 'today' : shortDate(s);
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : null; };
const fmtNum = n => Math.round(n || 0).toLocaleString('en-US');

const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };

const kcalOf = (p, c, f) => Math.round((4 * p + 4 * c + 9 * f) / 10) * 10;
const timeType = () => { const h = new Date().getHours(); return h < 11 ? 'b' : h < 15 ? 'l' : h < 20 ? 'd' : 's'; };

const CHECK = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function alternativesFor(name) {

function plates(w) {
  w = num(w); if (!w || w <= 45) return '';
  let side = (w - 45) / 2; const out = [];
  for (const p of [45, 35, 25, 10, 5, 2.5]) { while (side >= p - 1e-9) { out.push(p); side -= p; } }
  if (side > 0.01) return '';
  return out.join(' + ') + ' a side';
}

function calc(p) {
  const metric = p.units === 'metric';
  const kg = metric ? num(p.kg) : (num(p.lb) || 0) * 0.45359237;
  const cm = metric ? num(p.cm) : ((num(p.ft) || 0) * 12 + (num(p.inch) || 0)) * 2.54;
  const age = num(p.age);
  if (!kg || !cm || !age) return null;
  const bmr = 10 * kg + 6.25 * cm - 5 * age + (p.sex === 'female' ? -161 : 5);
  const tdee = bmr * Number(p.act || 1.55);
  let target = tdee + Number(p.goal || 0);
  const floor = p.sex === 'female' ? 1200 : 1500;
  const clamped = target < floor; if (clamped) target = floor;
  target = Math.round(target / 10) * 10;
  const lb = kg / 0.45359237;
  const pr = Math.round(lb * 0.9), fat = Math.round(target * 0.25 / 9);
  const carb = Math.max(0, Math.round((target - pr * 4 - fat * 9) / 4));
  return {tdee: Math.round(tdee / 10) * 10, kcal: target, p: pr, c: carb, f: fat, clamped, floor};
}

const LS_DOCS = 'lf.docs.v1', LS_UI = 'lf.ui.v1', LS_UNS = 'lf.unsynced.v1';

const ver = {}, busy = {}, timers = {};

function put(id, data, delay) {
  if (data === undefined) delete S.docs[id]; else S.docs[id] = data;
  lsSet(LS_DOCS, S.docs);
  ver[id] = (ver[id] || 0) + 1;
  unsynced.add(id); saveUns();
  clearTimeout(timers[id]);
  timers[id] = setTimeout(() => flush(id), delay == null ? 400 : delay);

}
async function flush(id) {
  clearTimeout(timers[id]); delete timers[id];
  if (!store.db || busy[id]) return;
  busy[id] = true;
  try {
    while (unsynced.has(id) && store.db) {
      const v = ver[id] || 0, data = S.docs[id];
      const ref = store.db.collection(store.base).doc(id);
      if (data === undefined) await ref.delete(); else await ref.set(clone(data));
      store.err = ''; store.retried[id] = 0;
      if ((ver[id] || 0) === v) { unsynced.delete(id); saveUns(); }
    }
  } catch (e) {
    const code = e && e.code;
    if (code === 'unavailable' && !store.retried[id]) { store.retried[id] = 1; setTimeout(() => flush(id), 1200 + Math.random() * 900); }
    else if (code === 'revoked' || code === 'not_granted' || code === 'capability_disabled' || code === 'capability_removed') { store.db = null; }
    else if (code === 'quota_exceeded') { store.err = 'Storage is full. Delete old workouts or meals to keep saving.'; }
    else { store.err = "Couldn't save to your account. Changes are kept on this device."; }
  }
  busy[id] = false;
  markStatus();
}
function markStatus() {

  if (!store.db) { el.textContent = 'Saved on this device'; el.dataset.state = 'local'; return; }
  const pend = unsynced.size > 0;
  el.textContent = pend ? 'Saving…' : 'Saved to your account';

}
async function initDb() {
  const c = window.claude; if (!c || typeof c.use !== 'function') return;
  try {
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    store.db = db; store.base = 'data/users/' + id;
    db.collection(store.base).onSnapshot(snap => {
      if (snap.metadata.fromCache && snap.empty) return;
      const remote = {};
      snap.docs.forEach(d => { if (d.exists) remote[d.id] = d.data(); });
      let changed = false;
      for (const k in remote) {
        if (unsynced.has(k)) continue;
        if (stable(S.docs[k]) !== stable(remote[k])) { S.docs[k] = clone(remote[k]); changed = true; }
      }
      if (!snap.metadata.fromCache) {
        for (const k of Object.keys(S.docs)) if (!(k in remote) && !unsynced.has(k)) { delete S.docs[k]; changed = true; }
      }
      lsSet(LS_DOCS, S.docs);
      if (changed) render(); else markStatus();
    }, () => { store.db = null; markStatus(); });
    [...unsynced].forEach(k => flush(k));

}

    out.push([score, n.length, it]);

}
function tickRest() {
  if (!restState) return;
  const left = Math.max(0, Math.ceil((restState.end - Date.now()) / 1000));
  $('#rtt').textContent = mmss(left);
  $('#rtl').textContent = 'Rest after ' + restState.label;
  $('#rtb').style.width = Math.max(0, Math.min(100, left / restState.total * 100)) + '%';
  if (left <= 0) finishRest();
}
function finishRest() {
  clearInterval(restIv); restIv = null; restState = null; lsSet(LS_REST, null);
  const el = $('#rest'); el.classList.add('done');
  $('#rtl').textContent = 'Rest is over'; $('#rtt').textContent = 'Next set'; $('#rtSkip').textContent = 'Close'; $('#rtb').style.width = '0%';
  beep(); try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
  releaseWake();
  restHideT = setTimeout(() => { if (!restState) hideRest(); }, 6000);
}
function hideRest() { $('#rest').hidden = true; document.body.classList.remove('resting'); }
function stopRest() { clearInterval(restIv); restIv = null; restState = null; lsSet(LS_REST, null); releaseWake(); clearTimeout(restHideT); hideRest(); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && restState) { tickRest(); requestWake(); } });
(() => { const saved = lsGet(LS_REST); if (saved && saved.end > Date.now()) { restState = saved; showRest(); } })();

/* ---------- launch screen ---------- */
const QUOTES = [
  ['The last three or four reps is what makes the muscle grow.', 'Arnold Schwarzenegger'],
  ['The mind is the limit.', 'Arnold Schwarzenegger'],
  ['Yeah buddy! Light weight!', 'Ronnie Coleman'],
  ["Ain't nothin' but a peanut.", 'Ronnie Coleman'],
  ["Stimulate, don't annihilate.", 'Lee Haney'],
];
(() => {
  const el = $('#splash'); if (!el) return;
  $('#spb').innerHTML = PLATE + '<span>Lift and Munch</span>';
  let k = Math.floor(Math.random() * QUOTES.length);
  const q = $('#spq'), w = $('#spw');
  const show = () => {
    const [text, who] = QUOTES[k % QUOTES.length]; k++;
    q.textContent = text; w.textContent = who;
    [q, w].forEach(n => { n.classList.remove('in'); void n.offsetWidth; n.classList.add('in'); });
  };
  show();
  const iv = setInterval(show, 1800);
  let gone = false;
  const done = () => { if (gone) return; gone = true; clearInterval(iv); el.classList.add('hide'); setTimeout(() => el.remove(), 550); };
  const t = setTimeout(done, 3600);
  el.addEventListener('click', () => { clearTimeout(t); done(); });
})();

render();
initDb();
})();
</script>
